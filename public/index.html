<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit — Tasks</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="welcome-overlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
        <h2 id="welcome-title">Buongiorno utente!</h2>
        <p>Welcome to <strong>Orbit</strong> — your team's task board. We're glad you're here.</p>
        <button id="welcome-close" type="button">Get started</button>
      </div>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <h1>Orbit</h1>
      </div>
      <p id="health-chip" class="chip" role="status">
        <span class="chip-dot" aria-hidden="true"></span>
        <span class="chip-text">Checking API…</span>
      </p>
    </header>

    <main>
      <section class="composer" aria-labelledby="composer-heading">
        <h2 id="composer-heading" class="sr-only">Add a task</h2>
        <form id="new-task">
          <div class="field field--grow">
            <label for="title">New task</label>
            <input id="title" name="title" placeholder="e.g. Prepare the launch checklist" autocomplete="off" required />
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Add task</button>
        </form>
        <p id="form-msg" class="form-msg" role="alert" hidden></p>
      </section>

      <div class="toolbar">
        <nav class="filters" aria-label="Filter tasks">
          <button type="button" class="filter is-active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="filter" data-filter="open" aria-pressed="false">Open</button>
          <button type="button" class="filter" data-filter="done" aria-pressed="false">Done</button>
        </nav>
        <p id="count" class="count"></p>
      </div>

      <section aria-label="Task board">
        <ul id="skeleton" class="cards" aria-hidden="true">
          <li class="card card--skeleton"><span class="sk sk--badge"></span><span class="sk sk--line"></span></li>
          <li class="card card--skeleton"><span class="sk sk--badge"></span><span class="sk sk--line sk--short"></span></li>
          <li class="card card--skeleton"><span class="sk sk--badge"></span><span class="sk sk--line"></span></li>
        </ul>
        <ul id="tasks" class="cards" hidden></ul>
        <p id="empty" class="state" hidden></p>
        <p id="error" class="state state--error" role="alert" hidden></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
